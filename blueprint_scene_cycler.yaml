blueprint:
  name: "Bouton - Appuis multiples en boucle (Scènes)"
  description: "Compte les appuis après le clic initial et déclenche les scènes en boucle à partir de l'index 1 (2e appui = scène 1, 3e appui = scène 2...)."
  domain: automation
  input:
    button_sensor:
      name: "Capteur / Action du bouton"
      description: "L'entité émettant l'événement d'appui (ex: sensor.telecommande_action)."
      selector:
        entity: {}
    button_state:
      name: "Valeur d'état déclencheur"
      description: "La valeur que prend l'entité lors d'un appui (ex: on_press, press, single, etc.)."
      default: "on_press"
      selector:
        text: {}
    scenes:
      name: "Scènes à cycler"
      description: "Sélectionner les scènes dans l'ordre souhaité. 2e appui = 1ère scène, 3e appui = 2ème scène, etc."
      selector:
        entity:
          domain: scene
          multiple: true

mode: single

triggers:
  - alias: "Réception de l'appui initial"
    trigger: state
    entity_id: !input button_sensor
    to: !input button_state

variables:
  scenes_list: !input scenes
  scenes_count: "{{ scenes_list | length }}"
  click_count: 1

actions:
  - alias: "Attente des appuis suivants"
    repeat:
      sequence:
        - alias: "Attente d'un nouvel appui pendant 1 seconde"
          wait_for_trigger:
            - trigger: state
              entity_id: !input button_sensor
              to: !input button_state
          timeout:
            seconds: 1
          continue_on_timeout: true
        - alias: "Incrémentation si un appui est détecté"
          if:
            - condition: template
              value_template: "{{ wait.trigger is not none }}"
          then:
            - variables:
                click_count: "{{ click_count + 1 }}"
      until:
        - alias: "Arrêt si aucun nouvel appui pendant 1 seconde"
          condition: template
          value_template: "{{ wait.trigger is none }}"

  - alias: "Vérification qu'il y a eu un 2e appui et des scènes configurées"
    condition: template
    value_template: "{{ click_count >= 2 and scenes_count | int > 0 }}"

  - alias: "Activation de la scène calculée"
    action: scene.turn_on
    target:
      entity_id: "{{ scenes_list[((click_count - 2) % scenes_count | int) | int] }}"
